name: Build & deploy GitHub Pages

on:
  push:
    branches: [main]
  # Pemeriksaan build + unit test untuk PR; deploy hanya dari main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Satu deploy dalam satu waktu; deploy yang sedang berjalan tidak dibatalkan.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # Situs proyek GitHub Pages ada di /<nama-repo>/. Di main path dibaca dari pengaturan Pages
      # ("/<nama-repo>", atau "" bila memakai domain kustom); di PR dari nama repo.
      - name: Baca konfigurasi Pages
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Tentukan base path
        env:
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "$PAGES_OUTCOME" = success ]; then base="$PAGES_BASE/"; else base="/$REPO_NAME/"; fi
          echo "BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "Base path: $base"

      - run: npm run build # membaca BASE_PATH (lihat vite.config.ts)

      # Base yang salah menghasilkan halaman kosong di Pages; gagalkan sebelum deploy.
      - name: Periksa base path & service worker
        run: |
          grep -q "src=\"${BASE_PATH}assets/" dist/index.html || { echo "::error::index.html tidak memakai base ${BASE_PATH}"; exit 1; }
          test -f dist/sw.js || { echo "::error::dist/sw.js tidak ada"; exit 1; }

      - name: Unggah artefak Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
